# Full-cycle refinement input. Numerical walls stay 1.5 m thick to isolate grid effects.
schema_version = 1
title = "Operating chamber · refined grid with fixed numerical wall"

[chamber]
# Solver x follows sliding travel; design width/depth are 6/4 m.
width_m = 4.0
depth_m = 6.0
height_m = 4.0
floor_m = 0.6
maximum_gap_m = 2.0
# Wall thickness is a numerical assumption, not an installed measurement.
physical_wall_thickness_m = 0.003

[domain]
x_m = 14.0
y_m = 10.0
z_m = 10.0

[air]
wind_speed_m_s = 1.5
wind_to_deg = 0.0
ambient_co2_ppm = 400.0
initial_co2_ppm = 400.0
temperature_k = 298.15
pressure_pa = 101325.0

[cycle]
closed_s = 300.0
open_phase_s = 600.0
opening_travel_s = 20.0
closing_travel_s = 20.0
cycles = 2

[palm]
height_m = 2.39
crown_radius_x_m = 1.52
crown_radius_y_m = 1.52
trunk_radius_m = 0.14483099821362477

[exchange]
net_co2_umol_s = -44.40047791098563
label = "Prescribed February 2025 daytime Q95 net uptake"
model = "constant_leaflet_net_exchange"

[fans]
count = 3
pole_x_m = 0.3
pole_y_m = 0.0
# Omit heights_m and azimuths_deg for equal bands and directions.
first_azimuth_deg = 0.0
model = "Delta AFC1212DE"
diameter_m = 0.12
free_air_cfm_per_fan = 148.3
momentum_factor = 1.0
kernel_sigma_m = 0.3
schedule = "closed_only"

[numerics]
cell_m = 0.25
dt_s = 0.5
save_every_s = 10.0
viscosity_m2_s = 1.5e-5
molecular_diffusivity_m2_s = 1.6e-5
smagorinsky = 0.12
turbulent_schmidt = 0.7
canopy_drag_per_m = 0.3
trunk_drag_per_m = 20.0

[waterlily]
# Native BDIM needs a resolved solid core. Outward wall thickening changes
# exterior geometry and must be checked before quantitative interpretation.
kernel_width_cells = 1.0
numerical_wall_cells = 6.0
pressure_tolerance = 1.0e-12
pressure_max_iterations = 1000

[display]
co2_min_ppm = 380.0
co2_max_ppm = 405.0
fps = 6
